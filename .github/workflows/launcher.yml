name: Build Launcher

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        required: true
        default: Release
        type: choice
        options:
          - Release
          - RelWithDebInfo
          - Debug
  push:
    paths:
      - 'src/launcher-ui/**'
      - 'src/client/launcher/**'
      - 'src/client/resources/launcher/**'
      - 'src/client/component/game_data.hpp'
      - 'src/client/main.cpp'
      - 'tools/build_launcher.py'
      - '.github/workflows/launcher.yml'
  pull_request:
    paths:
      - 'src/launcher-ui/**'
      - 'src/client/launcher/**'
      - 'src/client/resources/launcher/**'
      - 'src/client/component/game_data.hpp'
      - 'src/client/main.cpp'
      - 'tools/build_launcher.py'
      - '.github/workflows/launcher.yml'

permissions:
  contents: read

concurrency:
  group: launcher-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-launcher:
    name: Windows x64 Launcher (${{ inputs.configuration || 'Release' }})
    runs-on: windows-2022
    env:
      CONFIG: ${{ inputs.configuration || 'Release' }}
    steps:
      - name: Check out source and dependencies
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/launcher-ui/package-lock.json

      - name: Build and test React launcher UI
        working-directory: src/launcher-ui
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build

      - name: Prepare WebView2 SDK and embed launcher assets
        run: python tools/build_launcher.py

      - name: Generate Visual Studio projects
        run: tools/premake5.exe vs2022

      - name: Build launcher client
        run: msbuild build/overlord.sln /t:client /m:2 /v:minimal /p:Configuration=${{ env.CONFIG }} /p:Platform=x64 /p:PreferredToolArchitecture=x64 /p:CL_MPCount=4

      - name: Package MWR VR launcher and installer
        run: python tools/build_installer.py ${{ env.CONFIG }}

      - name: Upload launcher executable and package
        uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ env.CONFIG }}-${{ github.sha }}
          path: |
            build/bin/x64/${{ env.CONFIG }}/overlord*.exe
            build/dist/*
          if-no-files-found: error
          retention-days: 14
